[project]
name = "code-review-agent"
version = "0.1.0"
description = "GitHub-integrated AI code review agent that finds real bugs with evidence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "cryptography>=42",
    "bandit>=1.7",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["app"]
